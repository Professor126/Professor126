<svg fill="none" width="300" height="260" viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Shimmering Gradient moving left to right -->
    <linearGradient id="heart-glow-gradient" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#800926" />
      <stop offset="40%" stop-color="#ff1a53" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#ff1a53" />
      <stop offset="100%" stop-color="#800926" />
      
      <!-- Sweep Animation every 3 seconds -->
      <animate 
        attributeName="x1" 
        from="-100%" 
        to="100%" 
        dur="3s" 
        repeatCount="indefinite" />
      <animate 
        attributeName="x2" 
        from="0%" 
        to="200%" 
        dur="3s" 
        repeatCount="indefinite" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pixel {
      fill: url(#heart-glow-gradient);
      filter: url(#neon-glow);
    }
  </style>

  <g class="pixel">
    <!-- Row 1 -->
    <rect x="60" y="20" width="30" height="30" rx="3"/>
    <rect x="90" y="20" width="30" height="30" rx="3"/>
    <rect x="180" y="20" width="30" height="30" rx="3"/>
    <rect x="210" y="20" width="30" height="30" rx="3"/>

    <!-- Row 2 -->
    <rect x="30" y="50" width="30" height="30" rx="3"/>
    <rect x="60" y="50" width="30" height="30" rx="3"/>
    <rect x="90" y="50" width="30" height="30" rx="3"/>
    <rect x="120" y="50" width="30" height="30" rx="3"/>
    <rect x="150" y="50" width="30" height="30" rx="3"/>
    <rect x="180" y="50" width="30" height="30" rx="3"/>
    <rect x="210" y="50" width="30" height="30" rx="3"/>
    <rect x="240" y="50" width="30" height="30" rx="3"/>

    <!-- Row 3 -->
    <rect x="30" y="80" width="30" height="30" rx="3"/>
    <rect x="60" y="80" width="30" height="30" rx="3"/>
    <rect x="90" y="80" width="30" height="30" rx="3"/>
    <rect x="120" y="80" width="30" height="30" rx="3"/>
    <rect x="150" y="80" width="30" height="30" rx="3"/>
    <rect x="180" y="80" width="30" height="30" rx="3"/>
    <rect x="210" y="80" width="30" height="30" rx="3"/>
    <rect x="240" y="80" width="30" height="30" rx="3"/>

    <!-- Row 4 -->
    <rect x="30" y="110" width="30" height="30" rx="3"/>
    <rect x="60" y="110" width="30" height="30" rx="3"/>
    <rect x="90" y="110" width="30" height="30" rx="3"/>
    <rect x="120" y="110" width="30" height="30" rx="3"/>
    <rect x="150" y="110" width="30" height="30" rx="3"/>
    <rect x="180" y="110" width="30" height="30" rx="3"/>
    <rect x="210" y="110" width="30" height="30" rx="3"/>
    <rect x="240" y="110" width="30" height="30" rx="3"/>

    <!-- Row 5 -->
    <rect x="60" y="140" width="30" height="30" rx="3"/>
    <rect x="90" y="140" width="30" height="30" rx="3"/>
    <rect x="120" y="140" width="30" height="30" rx="3"/>
    <rect x="150" y="140" width="30" height="30" rx="3"/>
    <rect x="180" y="140" width="30" height="30" rx="3"/>
    <rect x="210" y="140" width="30" height="30" rx="3"/>

    <!-- Row 6 -->
    <rect x="90" y="170" width="30" height="30" rx="3"/>
    <rect x="120" y="170" width="30" height="30" rx="3"/>
    <rect x="150" y="170" width="30" height="30" rx="3"/>
    <rect x="180" y="170" width="30" height="30" rx="3"/>

    <!-- Row 7 -->
    <rect x="120" y="200" width="30" height="30" rx="3"/>
    <rect x="150" y="200" width="30" height="30" rx="3"/>
  </g>
</svg>
