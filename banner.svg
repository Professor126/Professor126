<svg fill="none" width="800" height="160" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <style>
    .title {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
      letter-spacing: 1px;
    }
    .subtitle {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-style: italic;
      font-weight: 300;
      font-size: 18px;
      fill: #c9d1d9;
    }
  </style>

  <clipPath id="card-border">
    <rect width="100%" height="100%" rx="8" />
  </clipPath>

  <!-- Embedded GIF Image -->
  <g clip-path="url(#card-border)">
    <image href="https://camo.githubusercontent.com/925f17378dd1893b674a723c07535afe/68747470733a2f2f737461746963322e6b6c6970792e636f6d2f69692f39323566313733373864643138393362363734613732336330373533356166652f65652f65642f304146517a4d59452e676966" x="0" y="0" width="800" height="160" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Text Overlay -->
  <text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" class="title">HOLA! It's me, PROFESSOR</text>
  <text x="50%" y="74%" dominant-baseline="middle" text-anchor="middle" class="subtitle">Ain't your ordinary guy</text>
</svg>
